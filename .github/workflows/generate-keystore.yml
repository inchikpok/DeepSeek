name: Generate Keystore (One-Time)

'on':
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/treadmill.keystore \
            -alias treadmill \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass treadmill123 -keypass treadmill123 \
            -dname "CN=Treadmill Control, O=Custom, C=RU"
          keytool -list -v -keystore out/treadmill.keystore \
            -storepass treadmill123 -alias treadmill | grep -E "SHA1:|SHA256:"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: treadmill-keystore
          path: out/treadmill.keystore
