name: Build APK

'on':
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Verify keystore
        run: |
          KS=app/keystore/treadmill.keystore
          if [ ! -f "$KS" ]; then
            echo "::error::Keystore file $KS not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$KS")
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Keystore looks corrupt (size=$SIZE bytes)"
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass treadmill123 -alias treadmill \
            || { echo "::error::Keystore cannot be read"; exit 1; }
          echo "Keystore fingerprint (must be constant):"
          keytool -list -v -keystore "$KS" -storepass treadmill123 -alias treadmill \
            | grep -E "SHA1:|SHA256:" || true

      - name: Inject version code
        run: |
          NEW_CODE=$((${{ github.run_number }} + 10000))
          sed -i "s/versionCode = .*/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"2.0.${{ github.run_number }}\"/" app/build.gradle.kts

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Show APK signature (informational)
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          echo "--- keytool -printcert -jarfile ---"
          keytool -printcert -jarfile "$APK" 2>&1 | head -30 || true
          echo "--- apksigner verify ---"
          BT=$(ls -d "${ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "${BT}/apksigner" ]; then
            "${BT}/apksigner" verify --print-certs "$APK" 2>&1 | head -30 || true
          else
            echo "apksigner not found at expected path, skipping"
          fi

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: treadmill-debug-apk
          path: artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Treadmill Control ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
          body: |
            Автосборка из коммита ${{ github.sha }}.
            Скачайте `.apk` ниже и откройте на телефоне.
          files: artifacts/TreadmillControl-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
